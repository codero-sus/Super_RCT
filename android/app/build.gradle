plugins {
    id 'com.android.application'
}

android {
    namespace 'rct.android'
    compileSdk 34

    defaultConfig {
        applicationId 'rct.android'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
}
