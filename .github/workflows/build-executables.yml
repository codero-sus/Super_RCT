# Builds Super_RCT executables with tools/builder.py.
#
# One file per protocol (telegram, discord), one file per language (C, Python),
# one file per operating system. Every file is onefile: it runs without
# installing Python or any other runtime.
#
#   Linux    super_rct-<protocol>-c, super_rct-<protocol>-nuitka, super_rct-both-installers
#   macOS    super_rct-<protocol>-c, super_rct-<protocol>-nuitka
#   Windows  super_rct-<protocol>-nuitka.exe (C needs POSIX, so no Windows C build yet)
#
# Runs on: manual start (Actions tab), pushes to main and arena/** branches,
# pull requests to main, and version tags (v*). Tags also publish a GitHub
# Release with every executable attached.

name: Build executables

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: "c py-nuitka installers"
            protocols: "telegram discord"
            tag: linux
          - os: macos-latest
            targets: "c py-nuitka"
            protocols: "telegram discord"
            tag: macos
          - os: windows-latest
            targets: "py-nuitka"
            protocols: "telegram discord"
            tag: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nuitka
        if: contains(matrix.targets, 'py-nuitka')
        run: python -m pip install --upgrade pip nuitka ordered-set zstandard

      # Each part is its own step so a failure shows up by name in the run summary.
      - name: Builder tests - arguments, dry runs, wizard, refusals, protocols
        shell: bash
        working-directory: tests
        run: python -m unittest test_builder.ArgumentTests test_builder.DryRunTests test_builder.WizardTests test_builder.PlatformRefusalTests test_builder.ProtocolTests -v

      - name: Builder test - the Python target is one onefile executable
        shell: bash
        working-directory: tests
        run: python -m unittest test_builder.RealBuildTests.test_python_target_is_onefile -v

      - name: Builder test - build and run the C binary
        if: runner.os != 'Windows'
        shell: bash
        working-directory: tests
        run: python -m unittest test_builder.RealBuildTests.test_c_binary_runs -v

      - name: Build the executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            if [ "$t" = installers ]; then
              # Installers embed the shared source; not split by protocol yet.
              python tools/builder.py --target installers --out dist --name super_rct-both-installers
              continue
            fi
            for p in ${{ matrix.protocols }}; do
              python tools/builder.py --target "$t" --protocol "$p" --out dist \
                --name "super_rct-$p-$( [ "$t" = c ] && echo c || echo nuitka )"
            done
          done
          ls -la dist

      - name: Smoke test - each program prints its version
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in dist/super_rct-*-c dist/super_rct-*-c.exe \
                   dist/super_rct-*-nuitka dist/super_rct-*-nuitka.exe; do
            echo "== $f"
            "$f" --version
            found=$((found + 1))
          done
          test "$found" -gt 0

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: super_rct-${{ matrix.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: super_rct-*
          merge-multiple: true

      - name: Create the release with every executable attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la artifacts
          gh release create "$TAG" artifacts/* \
            --title "Super_RCT $TAG" \
            --notes "One executable per protocol (Telegram, Discord), per language (C, Python) and per OS. Built by .github/workflows/build-executables.yml."
