# Android edition (Java): compiles, unit-tests and builds the debug APK.
#
#   Job "core-tests"  runs the JUnit tests of the shared Java core on the JVM.
#   Job "apk"         builds android/app into a debug APK (after the tests pass).
#
# Sources live in android/ (Gradle). Runs on: manual start, pushes to main and
# arena/** branches, and pull requests to main, when android/ or this file changes.

name: Android edition (Java)

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run the core tests
        working-directory: android
        run: gradle :core:test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-reports
          path: android/core/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  apk:
    name: Debug APK
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Ubuntu runner ships the Android SDK; install only what the build needs.
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Using sdkmanager at $SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: super_rct-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
